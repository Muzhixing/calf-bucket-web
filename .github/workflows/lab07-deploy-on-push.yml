name: Lab07 Deploy on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy static page to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package Lab07 static page
        run: tar -C lab07/html -czf site.tar.gz .

      - name: Deploy to learner lab EC2
        env:
          DEPLOY_URL: http://100.54.15.252:8080/deploy
          DEPLOY_TOKEN: lab07-20242174
        run: |
          curl -fsS \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary @site.tar.gz \
            "${DEPLOY_URL}"

      - name: Verify deployed page
        run: |
          curl -fsS http://100.54.15.252/ | grep -F "20242174"
